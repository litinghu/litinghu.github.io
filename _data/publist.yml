- title: "Core Scheduling Techniques and Programming Abstractions for Scalable Serverless Edge Computing Engine"
  wellheight: 280
  image: serverless_edge.png
  description: The proliferation of 5G and beyond facilitates the advancement of next-generation technologies, including smart cities, self-driving cars, online video gaming, virtual reality, and augmented reality. This necessitates a re-evaluation of how these services are characterized and deployed. Serverless computing is an emerging paradigm, referring to a software architecture where an application is decomposed into triggers (also called events) and actions (also called functions), and there is a platform that provides seamless hosting and execution environment, making it easy to develop, manage, scale, and operate them. 
