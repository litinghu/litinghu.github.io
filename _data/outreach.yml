- title: C-Tech<sup>2</sup> Summer Program --- Computer Systems Programming Workshop "Proximity Sensor"
  wellheight: 390
  image: frontpage1.png
  description: We introduced computer systems programming to K12 Black/African American students and first-generation college students. The goal of the workshop is to teach students to build a proximity sensing system in Arduino using the C/C++ programming language. 

